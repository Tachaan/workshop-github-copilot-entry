<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container">
      <header>
        <div>
          <p class="eyebrow">Customer Support</p>
          <h1>Support Ticket Dashboard</h1>
        </div>
        <p class="updated">最終更新: <span id="last-updated"></span></p>
      </header>

      <section class="summary" aria-label="チケット件数">
        <article>
          <span>表示中</span>
          <strong id="visible-count">0</strong>
        </article>
        <article>
          <span>未対応</span>
          <strong id="open-count">0</strong>
        </article>
        <article>
          <span>対応中</span>
          <strong id="progress-count">0</strong>
        </article>
        <article>
          <span>期限切れ</span>
          <strong id="overdue-count">0</strong>
        </article>
      </section>

      <section class="controls" aria-label="チケットの検索と絞り込み">
        <label>
          キーワード検索
          <input id="search-input" type="search" placeholder="ID、件名、顧客名、担当者を検索">
        </label>
        <label>
          ステータス
          <select id="status-filter">
            <option value="all">すべて</option>
            <option value="open">未対応</option>
            <option value="in-progress">対応中</option>
            <option value="closed">完了</option>
          </select>
        </label>
        <label>
          並び順
          <select id="sort-order">
            <option value="dueDate">期限が近い順</option>
            <option value="priority">優先度の高い順</option>
          </select>
        </label>
      </section>

      <p id="empty-message" class="empty" hidden>条件に一致するチケットはありません。</p>
      <section id="ticket-list" class="ticket-list" aria-live="polite"></section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
